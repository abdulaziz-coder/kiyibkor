services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: kiyibkor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdev}
      POSTGRES_DB: kiyibkor
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kiyibkor"]
      interval: 5s
      retries: 10
  api:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://kiyibkor:${POSTGRES_PASSWORD:-localdev}@db:5432/kiyibkor
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      db: {condition: service_healthy}
    command: ["sh", "-c", "python -m app.database && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
volumes:
  postgres_data:
